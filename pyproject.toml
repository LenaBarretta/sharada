[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sharada"
dynamic = ["version"]
description = "Typed decisions from text in one forward pass — options in the request, calibrated probabilities, easy to fine-tune."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Lena Barretta" }]
keywords = ["text-classification", "zero-shot-classification", "calibration", "uncertainty", "decision-making"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers==5.12.1",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
train = ["datasets>=4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "datasets>=4",
]

[project.urls]
Homepage = "https://github.com/LenaBarretta/sharada"
Article = "https://lenatriestounderstand.com/notes/llm/024-rlcr/"

[tool.hatch.version]
path = "sharada/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sharada"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", "runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
